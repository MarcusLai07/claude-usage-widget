name: ClaudeUsage
options:
  bundleIdPrefix: com.marcuslai
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: P7DV5ZUK9A
    CURRENT_PROJECT_VERSION: 13
    MARKETING_VERSION: 0.6.2
targets:
  ClaudeUsage:
    type: application
    platform: macOS
    sources: [App, Shared]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Claude Usage
        CFBundleName: Claude Usage
        CFBundleIconFile: AppIcon
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.developer-tools
        CFBundleURLTypes:
          - CFBundleURLName: com.marcuslai.ClaudeUsage
            CFBundleURLSchemes: [claudeusage]
    entitlements:
      path: App/ClaudeUsage.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.application-groups:
          - P7DV5ZUK9A.com.marcuslai.ClaudeUsage
          # The old group, kept only so 0.6.1 can move its data over once.
          - group.com.marcuslai.ClaudeUsage
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.marcuslai.ClaudeUsage.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marcuslai.ClaudeUsage
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: ClaudeUsageWidget
  ClaudeUsageWidget:
    type: app-extension
    platform: macOS
    sources:
      - Widget
      - Shared
      - path: App/Resources/AppIcon.icns
      - path: App/Resources/Assets.xcassets
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Claude Usage
        CFBundleName: Claude Usage
        CFBundleIconFile: AppIcon
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/ClaudeUsageWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups:
          - P7DV5ZUK9A.com.marcuslai.ClaudeUsage
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.marcuslai.ClaudeUsage.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marcuslai.ClaudeUsage.Widget
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  # Renders the README screenshots offscreen with sample data (Scripts/shot.sh).
  # Builds the app's and the widget's real views with SHOTS set: no keychain,
  # network, ~/.claude, app group or window on screen.
  ClaudeUsageShots:
    type: tool
    platform: macOS
    sources:
      - path: App
        excludes: ["Info.plist", "ClaudeUsage.entitlements", "Resources/**"]
      - path: Shared
        # Shots/Inert.swift stands in for it: the tool never opens the keychain.
        excludes: ["TokenStore.swift"]
      - path: Widget
        excludes: ["Info.plist", "ClaudeUsageWidget.entitlements"]
      - Shots
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marcuslai.ClaudeUsage.Shots
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) SHOTS"
